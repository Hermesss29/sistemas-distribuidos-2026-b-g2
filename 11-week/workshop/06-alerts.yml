# CP7 - Burn-rate alerts for the HU-06 Register a loan journey (circulation-api).
# SLO 1 availability 99.5 % in 30 days -> error budget 0.005.
# SLO 2 latency 99 % under 1 s in 30 days -> error budget 0.01.
# Fast burn: 14.4x over 1h, confirmed over 5m (2 % of the budget).
# Slow burn: 6x over 6h, confirmed over 30m (5 % of the budget).
groups:
  - name: lms-circulation-slo-recording
    rules:
      - record: circulation:loan_error_ratio:rate5m
        expr: |
          sum(rate(circulation_loan_requests_total{route="/api/v1/loans",outcome="error"}[5m]))
          / sum(rate(circulation_loan_requests_total{route="/api/v1/loans"}[5m]))
      - record: circulation:loan_error_ratio:rate30m
        expr: |
          sum(rate(circulation_loan_requests_total{route="/api/v1/loans",outcome="error"}[30m]))
          / sum(rate(circulation_loan_requests_total{route="/api/v1/loans"}[30m]))
      - record: circulation:loan_error_ratio:rate1h
        expr: |
          sum(rate(circulation_loan_requests_total{route="/api/v1/loans",outcome="error"}[1h]))
          / sum(rate(circulation_loan_requests_total{route="/api/v1/loans"}[1h]))
      - record: circulation:loan_error_ratio:rate6h
        expr: |
          sum(rate(circulation_loan_requests_total{route="/api/v1/loans",outcome="error"}[6h]))
          / sum(rate(circulation_loan_requests_total{route="/api/v1/loans"}[6h]))
      - record: circulation:loan_slow_ratio:rate5m
        expr: |
          1 - sum(rate(circulation_loan_request_duration_seconds_bucket{route="/api/v1/loans",le="1"}[5m]))
          / sum(rate(circulation_loan_request_duration_seconds_count{route="/api/v1/loans"}[5m]))
      - record: circulation:loan_slow_ratio:rate1h
        expr: |
          1 - sum(rate(circulation_loan_request_duration_seconds_bucket{route="/api/v1/loans",le="1"}[1h]))
          / sum(rate(circulation_loan_request_duration_seconds_count{route="/api/v1/loans"}[1h]))

  - name: lms-circulation-slo-alerts
    rules:
      - alert: LoanRegistrationAvailabilityFastBurn
        expr: |
          circulation:loan_error_ratio:rate1h > (14.4 * 0.005)
          and circulation:loan_error_ratio:rate5m > (14.4 * 0.005)
          and sum(increase(circulation_loan_requests_total{route="/api/v1/loans"}[1h])) >= 5
        for: 2m
        labels:
          severity: page
          team: g2-lms
          service: circulation-api
          slo: loan-availability
        annotations:
          summary: "HU-06 loans failing: burning the 30-day availability budget 14.4x faster than allowed"
          description: "Error ratio of POST /api/v1/loans is {{ $value | humanizePercentage }} in the last hour (SLO 99.5 %)."
          runbook_url: "https://github.com/Hermesss29/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"

      - alert: LoanRegistrationAvailabilitySlowBurn
        expr: |
          circulation:loan_error_ratio:rate6h > (6 * 0.005)
          and circulation:loan_error_ratio:rate30m > (6 * 0.005)
          and sum(increase(circulation_loan_requests_total{route="/api/v1/loans"}[6h])) >= 10
        for: 15m
        labels:
          severity: ticket
          team: g2-lms
          service: circulation-api
          slo: loan-availability
        annotations:
          summary: "HU-06 loans failing slowly: 6x burn of the availability budget over 6 hours"
          description: "Error ratio of POST /api/v1/loans is {{ $value | humanizePercentage }} in the last 6 hours (SLO 99.5 %)."
          runbook_url: "https://github.com/Hermesss29/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"

      - alert: LoanRegistrationLatencyFastBurn
        expr: |
          circulation:loan_slow_ratio:rate1h > (14.4 * 0.01)
          and circulation:loan_slow_ratio:rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: page
          team: g2-lms
          service: circulation-api
          slo: loan-latency
        annotations:
          summary: "HU-06 loans slow: more than 14.4 % of loans take over 1 s"
          description: "Share of POST /api/v1/loans slower than 1 s is {{ $value | humanizePercentage }} in the last hour (SLO 99 % under 1 s)."
          runbook_url: "https://github.com/Hermesss29/sistemas-distribuidos-2026-b-g2/blob/main/11-week/workshop/07-runbook.md"
