# Security gates proposed for lms-membership-api (Go 1.25, chi, golang-jwt).
# Lives in my fork as a proposal for the team pipeline (W13 CP4); not yet in the code repo.
name: security

on:
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  authz:
    name: Negative authorization tests (story library-docs#41)
    runs-on: ubuntu-latest
    needs: [secrets, dependencies]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Service token must not reach admin routes
        run: go test ./internal/adapter/in/httpapi/middleware/ -run TestServiceToken -v
